x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.0
    container_name: finals-compass-mysql
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app-network
    logging: *default-logging

  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    container_name: finals-compass-backend
    user: "10001:10001"
    init: true
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      markitdown-worker:
        condition: service_healthy
      pdf-renderer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      UPLOAD_DIR: /app/uploads
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_DISPLAY_NAME: ${APP_ADMIN_DISPLAY_NAME:-Administrator}
      AI_SECRET_ENCRYPTION_KEY: ${AI_SECRET_ENCRYPTION_KEY:-}
      AI_CALLS_PER_MINUTE: ${AI_CALLS_PER_MINUTE:-6}
      AI_PLATFORM_DAILY_CALLS: ${AI_PLATFORM_DAILY_CALLS:-20}
      AI_PLATFORM_MONTHLY_TOKENS: ${AI_PLATFORM_MONTHLY_TOKENS:-100000}
      QUESTION_TOPICS_PER_HOUR: ${QUESTION_TOPICS_PER_HOUR:-5}
      QUESTION_ANSWERS_PER_HOUR: ${QUESTION_ANSWERS_PER_HOUR:-30}
      ADMIN_CONTACTS_PER_HOUR: ${ADMIN_CONTACTS_PER_HOUR:-5}
      ADMIN_BROADCASTS_PER_HOUR: ${ADMIN_BROADCASTS_PER_HOUR:-10}
      MAIL_SECRET_ENCRYPTION_KEY: ${MAIL_SECRET_ENCRYPTION_KEY:-}
      EMAIL_CODE_PEPPER: ${EMAIL_CODE_PEPPER:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_ENV: ${APP_ENV:-prod}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      APP_LOGIN_URL: ${APP_LOGIN_URL}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      BROWSER_BRIDGE_ALLOWED_ORIGINS: ${BROWSER_BRIDGE_ALLOWED_ORIGINS}
      TRUSTED_PROXY_ADDRESSES: ${TRUSTED_PROXY_ADDRESSES:-127.0.0.1,::1,172.28.0.1,172.28.0.10}
      MICROSOFT_MAIL_CLIENT_ID: ${MICROSOFT_MAIL_CLIENT_ID:-}
      MICROSOFT_MAIL_CLIENT_SECRET: ${MICROSOFT_MAIL_CLIENT_SECRET:-}
      MICROSOFT_MAIL_REDIRECT_URI: ${MICROSOFT_MAIL_REDIRECT_URI:-}
      MARKITDOWN_WORKER_URL: http://markitdown-worker:8090
      MARKITDOWN_WORKER_TOKEN: ${MARKITDOWN_WORKER_TOKEN}
      PDF_RENDERER_URL: http://pdf-renderer:8787
      PDF_RENDERER_TOKEN: ${PDF_RENDERER_TOKEN}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:MaxMetaspaceSize=192m
      LOG_DIR: /app/logs
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-30}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-2GB}
    volumes:
      - uploads:/app/uploads
      - backend_logs:/app/logs
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    container_name: finals-compass-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  markitdown-worker:
    build:
      context: ..
      dockerfile: services/markitdown-worker/Dockerfile
    container_name: finals-compass-markitdown
    restart: unless-stopped
    environment:
      MARKITDOWN_WORKER_TOKEN: ${MARKITDOWN_WORKER_TOKEN}
      MARKITDOWN_MAX_BYTES: 20971520
      MARKITDOWN_MAX_CHARS: 60000
      MARKITDOWN_MAX_CONCURRENCY: 2
      MARKITDOWN_MAX_PDF_PAGES: 80
      MARKITDOWN_MAX_AUDIO_SECONDS: 600
      MARKITDOWN_MAX_ARCHIVE_ENTRIES: 2000
      MARKITDOWN_MAX_UNPACKED_BYTES: 104857600
      MARKITDOWN_MAX_COMPRESSION_RATIO: 200
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  pdf-renderer:
    build:
      context: ..
      dockerfile: services/pdf-renderer/Dockerfile
    container_name: finals-compass-pdf-renderer
    init: true
    restart: unless-stopped
    environment:
      PDF_RENDERER_TOKEN: ${PDF_RENDERER_TOKEN}
      PDF_RENDERER_HOST: 0.0.0.0
      PDF_RENDERER_PORT: 8787
      PDF_RENDERER_MAX_CONCURRENCY: 2
      CHROME_PATH: /usr/bin/chromium
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - app-network
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    profiles:
      - container-frontend
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    container_name: finals-compass-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      app-network:
        ipv4_address: 172.28.0.10
    logging: *default-logging

  loki:
    image: grafana/loki:3.5.1
    container_name: finals-compass-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - app-network
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: finals-compass-alloy
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    depends_on:
      - loki
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - app-network
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.1.0
    container_name: finals-compass-grafana
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app-network
    logging: *default-logging

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  mysql_data:
  uploads:
  backend_logs:
  loki_data:
  grafana_data:
  alloy_data:
