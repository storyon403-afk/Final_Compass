services:
  mysql:
    image: mysql:8.0
    container_name: finals-compass-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    container_name: finals-compass-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - markitdown-worker
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      UPLOAD_DIR: /app/uploads
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_DISPLAY_NAME: ${APP_ADMIN_DISPLAY_NAME:-Administrator}
      AI_SECRET_ENCRYPTION_KEY: ${AI_SECRET_ENCRYPTION_KEY:-}
      MARKITDOWN_WORKER_URL: http://markitdown-worker:8090
      MARKITDOWN_WORKER_TOKEN: ${MARKITDOWN_WORKER_TOKEN}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:MaxMetaspaceSize=192m
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app-network

  markitdown-worker:
    build:
      context: ..
      dockerfile: services/markitdown-worker/Dockerfile
    container_name: finals-compass-markitdown
    restart: unless-stopped
    environment:
      MARKITDOWN_WORKER_TOKEN: ${MARKITDOWN_WORKER_TOKEN}
      MARKITDOWN_MAX_BYTES: 20971520
      MARKITDOWN_MAX_CHARS: 60000
    networks:
      - app-network
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true

  frontend:
    profiles:
      - container-frontend
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    container_name: finals-compass-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  uploads:
