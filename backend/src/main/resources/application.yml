spring:
  application:
    name: finals-compass-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/finals_compass?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:finals}
    password: ${DB_PASSWORD:change-me}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:40MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:42MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      static-locations: ${STATIC_LOCATIONS:classpath:/static/}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
app:
  environment: ${APP_ENV:dev}
  mail:
    encryption-key: ${MAIL_SECRET_ENCRYPTION_KEY:}
    verification-pepper: ${EMAIL_CODE_PEPPER:}
    login-url: ${APP_LOGIN_URL:http://127.0.0.1:5173}
    frontend-url: ${APP_FRONTEND_URL:http://127.0.0.1:5173}
    microsoft:
      client-id: ${MICROSOFT_MAIL_CLIENT_ID:}
      client-secret: ${MICROSOFT_MAIL_CLIENT_SECRET:}
      redirect-uri: ${MICROSOFT_MAIL_REDIRECT_URI:}
  upload-dir: ${UPLOAD_DIR:../uploads}
  ai:
    # 32 random bytes encoded with Base64. Keep it outside Git; changing it makes saved API keys unreadable.
    encryption-key: ${AI_SECRET_ENCRYPTION_KEY:}
    limits:
      calls-per-minute: ${AI_CALLS_PER_MINUTE:6}
      platform-daily-calls: ${AI_PLATFORM_DAILY_CALLS:20}
      platform-monthly-tokens: ${AI_PLATFORM_MONTHLY_TOKENS:100000}
    document-worker:
      url: ${MARKITDOWN_WORKER_URL:}
      token: ${MARKITDOWN_WORKER_TOKEN:}
      timeout: ${MARKITDOWN_WORKER_TIMEOUT:60s}
  bootstrap-admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
    display-name: ${APP_ADMIN_DISPLAY_NAME:Administrator}
