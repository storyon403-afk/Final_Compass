spring:
  application:
    name: finals-compass-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:100MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:140MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      static-locations: ${STATIC_LOCATIONS:classpath:/static/}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS}
app:
  environment: ${APP_ENV:dev}
  mail:
    encryption-key: ${MAIL_SECRET_ENCRYPTION_KEY:}
    verification-pepper: ${EMAIL_CODE_PEPPER:}
    login-url: ${APP_LOGIN_URL}
    frontend-url: ${APP_FRONTEND_URL}
    microsoft:
      client-id: ${MICROSOFT_MAIL_CLIENT_ID:}
      client-secret: ${MICROSOFT_MAIL_CLIENT_SECRET:}
      redirect-uri: ${MICROSOFT_MAIL_REDIRECT_URI:}
  upload-dir: ${UPLOAD_DIR:../uploads}
  ai:
    # 32 random bytes encoded with Base64. Keep it outside Git; changing it makes saved API keys unreadable.
    encryption-key: ${AI_SECRET_ENCRYPTION_KEY:}
    limits:
      calls-per-minute: ${AI_CALLS_PER_MINUTE:6}
      platform-daily-calls: ${AI_PLATFORM_DAILY_CALLS:20}
      platform-monthly-tokens: ${AI_PLATFORM_MONTHLY_TOKENS:100000}
    document-worker:
      url: ${MARKITDOWN_WORKER_URL:}
      token: ${MARKITDOWN_WORKER_TOKEN:}
      timeout: ${MARKITDOWN_WORKER_TIMEOUT:60s}
    pdf-renderer:
      url: ${PDF_RENDERER_URL:}
      token: ${PDF_RENDERER_TOKEN:}
    agent-gateway:
      url: ${AGENT_GATEWAY_URL:}
  bootstrap-admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
    display-name: ${APP_ADMIN_DISPLAY_NAME:Administrator}
