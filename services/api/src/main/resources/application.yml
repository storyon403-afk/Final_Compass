spring:
  application:
    name: finals-compass-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:100MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:140MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      static-locations: ${STATIC_LOCATIONS:classpath:/static/}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    min-response-size: ${SERVER_COMPRESSION_MIN_SIZE:2KB}
    mime-types: application/json,text/html,text/plain,text/css,text/javascript,application/javascript,image/svg+xml
app:
  environment: ${APP_ENV:dev}
  # Enable only after HTTPS is live; Secure cookies are not sent over plain HTTP.
  session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
  auth-throttle:
    failures-before-lock: ${AUTH_FAILURES_BEFORE_LOCK:5}
    maximum-lock-seconds: ${AUTH_MAXIMUM_LOCK_SECONDS:900}
  browser-bridge:
    allowed-origin-patterns: ${BROWSER_BRIDGE_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,chrome-extension://*}
  mail:
    encryption-key: ${MAIL_SECRET_ENCRYPTION_KEY:}
    verification-pepper: ${EMAIL_CODE_PEPPER:}
    login-url: ${APP_LOGIN_URL:http://localhost:5173}
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    microsoft:
      client-id: ${MICROSOFT_MAIL_CLIENT_ID:}
      client-secret: ${MICROSOFT_MAIL_CLIENT_SECRET:}
      redirect-uri: ${MICROSOFT_MAIL_REDIRECT_URI:}
  upload-dir: ${UPLOAD_DIR:../../uploads}
  ai:
    # 32 random bytes encoded with Base64. Keep it outside Git; changing it makes saved API keys unreadable.
    encryption-key: ${AI_SECRET_ENCRYPTION_KEY:}
    limits:
      calls-per-minute: ${AI_CALLS_PER_MINUTE:6}
      platform-daily-calls: ${AI_PLATFORM_DAILY_CALLS:20}
      platform-monthly-tokens: ${AI_PLATFORM_MONTHLY_TOKENS:100000}
    document-worker:
      url: ${MARKITDOWN_WORKER_URL:}
      token: ${MARKITDOWN_WORKER_TOKEN:}
      timeout: ${MARKITDOWN_WORKER_TIMEOUT:60s}
    pdf-renderer:
      url: ${PDF_RENDERER_URL:}
      token: ${PDF_RENDERER_TOKEN:}
    agent-gateway:
      url: ${AGENT_GATEWAY_URL:}
  bootstrap-admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
    display-name: ${APP_ADMIN_DISPLAY_NAME:Administrator}
